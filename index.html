<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="splash">
      <h1>To-Do List</h1>
      <p>Manage Your Tasks Efficiently</p>
      <button class="start-btn">Get Started</button>
    </div>

    <!-- SUCCESS MESSAGE -->

    <div class="card hide">
      <h1 class="heading">To-Do List</h1>

      <p class="counter">Total Tasks: 0</p>

      <textarea class="input" placeholder="Enter Your Task..."></textarea>
      <div id="success-message" class="success-message"></div>

      <p class="error-message"></p>

      <div class="controls">
        <select class="priority">
          <option>High</option>
          <option>Medium</option>
          <option>Low</option>
        </select>

        <button class="btn">Add</button>
      </div>
      <div class="find-controls">
        <input class="find-id" placeholder="Enter Todo ID" />
        <button class="find-btn">Find</button>
      </div>
      <div class="find-result"></div>
      <p class="find-error"></p>
      <ul class="list"></ul>
    </div>

    <script src="script.js"></script>
  </body>
</html>
